<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e3d">
  <title>Pedidos</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icones/icone-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="tela-login" class="tela-login" hidden>
    <form id="form-login" class="cartao cartao-login">
      <h1>Pedidos</h1>
      <p class="dica">Entre com seu usuário</p>
      <label class="rotulo">Usuário<input class="input" name="login" autocomplete="username" autocapitalize="none" required autofocus></label>
      <label class="rotulo">Senha<input class="input" name="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primario btn-grande" type="submit">Entrar</button>
    </form>
  </div>

  <div id="app" hidden>
    <header class="topo">
      <div class="marca">Pedidos</div>
      <nav id="menu" class="menu" aria-label="Menu"></nav>
      <div class="topo-dir">
        <button id="conexao" class="conexao" hidden></button>
        <button id="ativar-notificacoes" class="btn btn-peq" hidden>Ativar notificações</button>
        <span id="usuario" class="usuario"></span>
        <button id="sair" class="btn btn-peq">Sair</button>
      </div>
    </header>
    <main id="conteudo"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
